<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>俄罗斯方块</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>🧩 俄罗斯方块</h1>
      <button id="btn-sound" class="icon-btn" title="声音开关" aria-label="声音开关">🔊</button>
    </header>

    <main class="game-area">
      <div class="board-wrap">
        <canvas id="board" width="300" height="600"></canvas>
        <!-- 覆盖层：开始 / 暂停 / 结束 -->
        <div id="overlay" class="overlay">
          <div class="overlay-box">
            <div id="overlay-title" class="overlay-title">俄罗斯方块</div>
            <div id="overlay-sub" class="overlay-sub">按下开始按钮或回车键开始游戏</div>
            <div id="overlay-score" class="overlay-score"></div>
            <button id="btn-start" class="primary-btn">开始游戏</button>
            <div class="overlay-hint">
              <div>← → 移动　↑ / X / Z 旋转　↓ 软降</div>
              <div>空格 硬降　P 暂停　R 重开　M 声音</div>
            </div>
          </div>
        </div>
      </div>

      <aside class="side-panel">
        <section class="panel next-panel">
          <h2>下一个</h2>
          <canvas id="next" width="120" height="190"></canvas>
        </section>
        <section class="panel stats">
          <div class="stat"><span>分数</span><strong id="stat-score">0</strong></div>
          <div class="stat"><span>最高分</span><strong id="stat-best">0</strong></div>
          <div class="stat"><span>等级</span><strong id="stat-level">1</strong></div>
          <div class="stat"><span>消行</span><strong id="stat-lines">0</strong></div>
        </section>
        <section class="panel controls">
          <button id="btn-pause" class="mini-btn">暂停</button>
          <button id="btn-restart" class="mini-btn">重新开始</button>
        </section>
        <section class="panel ai-panel">
          <h2>🤖 AI 托管</h2>
          <div class="ai-row">
            <button id="btn-ai" class="ai-toggle off">开启 AI 托管</button>
            <button id="btn-ai-settings" class="mini-btn">AI 设置</button>
          </div>
          <div id="ai-status" class="ai-status">未配置</div>
        </section>
      </aside>
    </main>

    <!-- AI 设置弹窗 -->
    <div id="ai-modal" class="modal hidden">
      <div class="modal-box">
        <h3>🤖 AI 设置</h3>
        <div class="field">
          <label for="ai-provider">服务商</label>
          <select id="ai-provider">
            <option value="deepseek">DeepSeek</option>
            <option value="openai">OpenAI</option>
            <option value="qwen">通义千问</option>
            <option value="ollama">Ollama 本地</option>
            <option value="custom">自定义</option>
          </select>
        </div>
        <div class="field"><label for="ai-baseurl">API 地址</label><input id="ai-baseurl" type="url" placeholder="https://api.example.com/v1" spellcheck="false"></div>
        <div class="field"><label for="ai-apikey">API Key</label><input id="ai-apikey" type="password" placeholder="sk-..." autocomplete="off" spellcheck="false"></div>
        <div class="field"><label for="ai-model">模型名称</label><input id="ai-model" placeholder="model-name" spellcheck="false"></div>
        <div class="field"><label for="ai-delay">动作间隔 <span id="ai-delay-val">60</span>ms</label><input id="ai-delay" type="range" min="10" max="200" step="10" value="60"></div>
        <div id="ai-msg" class="ai-msg"></div>
        <div class="modal-actions">
          <button id="ai-test" class="mini-btn">测试连接</button>
          <span class="spacer"></span>
          <button id="ai-cancel" class="mini-btn">取消</button>
          <button id="ai-save" class="primary-btn small">保存</button>
        </div>
      </div>
    </div>
    <!-- 移动端触控按钮 -->
    <div class="touch-controls">
      <div class="touch-row">
        <button class="touch-btn" data-action="left" aria-label="左移">◀</button>
        <button class="touch-btn" data-action="rotate" aria-label="旋转">↻</button>
        <button class="touch-btn" data-action="right" aria-label="右移">▶</button>
      </div>
      <div class="touch-row">
        <button class="touch-btn" data-action="soft" aria-label="软降">▼</button>
        <button class="touch-btn touch-wide" data-action="hard" aria-label="硬降">⤓ 速降</button>
        <button class="touch-btn" data-action="pause" aria-label="暂停">⏸</button>
      </div>
    </div>

    <footer class="foot">
      方向键 / 触控按钮操作 · 消行得分，填满即结束
    </footer>
  </div>

  <script src="game.js"></script>
  <script src="ai.js"></script>
  <script src="main.js"></script>
</body>
</html>
